aid: padlet
name: Padlet
description: Padlet is a collaborative visual platform of boards and canvases ("padlets") used across
  education and creative work to collect, organize, and share posts, images, links, and files. Its public
  REST API (api.padlet.dev, JSON:API) lets paying users read boards with their sections, posts, comments,
  and reactions, create posts, comments, and reactions, generate AI recipe boards, and read user and organization
  data — authenticated with an x-api-key header. Padlet also runs an official OAuth-protected MCP server
  at mcp.padlet.com for agent access.
