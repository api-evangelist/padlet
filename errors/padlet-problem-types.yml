error_codes:
- code: BAD_REQUEST
  status: 400
  description: The request contained invalid parameters.
- code: PARAMETER_MISSING
  status: 400
  description: A required parameter is missing from the request.
- code: PADLET_ARCHIVED
  status: 400
  description: The padlet you are trying to access is archived. Unarchive the padlet to access it with
