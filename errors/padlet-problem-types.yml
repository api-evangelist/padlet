- code: INVALID_API_KEY
  status: 401
  description: The API token provided in the x-api-key header is invalid or has been revoked.
- code: NOT_ADMIN
  status: 401
  description: You are not an admin of the padlet you are trying to access.
- code: NOT_PAYING_USER
  status: 403
  description: You are not a paying user. Only paying users can access the API.
- code: NOT_FOUND
  status: 404
  description: The requested resource was not found.
- code: NOT_UNIQUE
  status: 422
  description: The resource already exists and duplicates are not allowed.
- code: RATE_LIMIT_EXCEEDED
  status: 429
  description: You have exceeded the rate limit (250 requests/minute). Wait a minute and try again.
